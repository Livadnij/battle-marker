[project]
name = "battle-marker"
version = "0.1.0"
description = "Finds Battlefield highlight badges in Steam background recordings and adds Steam timeline markers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pyside6>=6.8",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real ffmpeg or real recordings, skipped unless asked for"]
